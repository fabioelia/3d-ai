# Automatic GitHub Pages deploys: on every push to main, install, test, build and publish dist/.
#
# To turn it on, copy this file to .github/workflows/pages.yml (the GitHub web editor is the
# quickest way), then set Settings -> Pages -> Build and deployment -> Source to "GitHub Actions".
# Until then the site is published from the gh-pages branch by `npm run deploy`.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kernel tests
        run: npm test
      - name: Build
        run: npm run bundle
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
